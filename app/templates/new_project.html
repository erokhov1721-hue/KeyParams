{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div>
    <a class="back-link" href="{{ url_for('main.index') }}">&larr; Все проекты</a>
    <h1>Новый проект</h1>
    <p class="page-sub">
      Загрузите договор генподряда и техническое задание — паспорт объекта
      соберётся автоматически, недостающее впишете вручную.
    </p>
  </div>
</div>

<div class="card form-card">
  {% if error %}
  <div class="alert alert-error">{{ error }}</div>
  {% endif %}
  <form method="post" action="{{ url_for('main.create_project') }}" enctype="multipart/form-data">
    <div class="field">
      <label for="project_name">Название проекта</label>
      <input type="text" id="project_name" name="project_name" placeholder="Например, Проспект Мира" autocomplete="off">
    </div>

    <div class="field">
      <label for="dgp_file">Договор генподряда (ДГП), .docx</label>
      <label class="file-drop" for="dgp_file">
        <svg class="file-drop-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <span class="file-drop-text" data-placeholder="Выберите файл .docx">Выберите файл .docx</span>
      </label>
      <input class="file-input" type="file" id="dgp_file" name="dgp_file" accept=".docx">
    </div>

    <div class="field">
      <label for="tz_file">Техническое задание (ТЗ), .docx</label>
      <label class="file-drop" for="tz_file">
        <svg class="file-drop-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <span class="file-drop-text" data-placeholder="Выберите файл .docx">Выберите файл .docx</span>
      </label>
      <input class="file-input" type="file" id="tz_file" name="tz_file" accept=".docx">
    </div>

    <div class="field">
      <label for="smeta_file">Смета (необязательно), .xlsx</label>
      <label class="file-drop" for="smeta_file">
        <svg class="file-drop-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <span class="file-drop-text" data-placeholder="Выберите файл .xlsx">Выберите файл .xlsx</span>
      </label>
      <input class="file-input" type="file" id="smeta_file" name="smeta_file" accept=".xlsx">
    </div>

    <div class="field">
      <label for="contract_terms_file">Протокол окончательных условий (необязательно), .pdf</label>
      <label class="file-drop" for="contract_terms_file">
        <svg class="file-drop-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
          <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </svg>
        <span class="file-drop-text" data-placeholder="Выберите файл .pdf">Выберите файл .pdf</span>
      </label>
      <input class="file-input" type="file" id="contract_terms_file" name="contract_terms_file" accept=".pdf">
    </div>

    <button type="submit" class="btn btn-primary btn-block">Создать проект</button>
  </form>
</div>

<script>
  document.querySelectorAll('.file-input').forEach(function (input) {
    input.addEventListener('change', function () {
      var textEl = input.closest('.field').querySelector('.file-drop-text');
      textEl.textContent = input.files[0] ? input.files[0].name : textEl.dataset.placeholder;
    });
  });
</script>
{% endblock %}
