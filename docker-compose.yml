# Удобный способ поднять образ локально или на сервере: `docker compose up
# -d --build`. Не обязателен — тот же контейнер можно поднять одним `docker
# run`, здесь просто уже расписаны том и порт (см. README.md, раздел
# «Docker», за объяснением переменных ниже и тем, чего Linux-образ стоит по
# сравнению с родным Windows-запуском).
services:
  keyparams:
    build: .
    ports:
      - "8080:8080"
    volumes:
      # Всё состояние приложения — данные проектов, EasyOCR-модели, ключ
      # подписи cookie/CSRF, журнал — под одним томом (см. Dockerfile:
      # KEYPARAMS_PROJECTS_ROOT, EASYOCR_MODULE_PATH и home-каталог
      # пользователя keyparams все смотрят под /data). Без него контейнер
      # с нуля на каждом перезапуске — новый ключ подписи разлогинивает
      # открытые вкладки, а объекты и вовсе пропадают.
      - keyparams-data:/data
    environment:
      # Нужен только тем полям паспорта объекта, что распознаёт AI
      # (см. app/ai_extractor.py); без него это просто не сработает,
      # остальное приложение не пострадает. Ключ — секрет, наружу не
      # коммитить: задавать через `docker compose --env-file` или окружение
      # хоста, не хардкодить в этом файле.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Подписывает CSRF-токены и cookie сессии — без него при каждом
      # перезапуске контейнера генерируется новый, и все открытые вкладки
      # разлогиниваются. Один раз сгенерировать (например,
      # `python -c "import secrets; print(secrets.token_hex(32))"`) и
      # держать неизменным между перезапусками/масштабированием.
      - KEYPARAMS_SECRET_KEY=${KEYPARAMS_SECRET_KEY:-}
      # Распознавание сканов и картинок в файлах — на CPU это минуты на
      # объект (см. app/passport.py), поэтому выключено по умолчанию даже
      # здесь, как и при родном запуске на Windows. Раскомментировать, если
      # скорость не критична, а качество важнее:
      # - OCR_FALLBACK_ENABLED=1
    restart: unless-stopped

volumes:
  keyparams-data:
